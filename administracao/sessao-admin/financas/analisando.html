<script>
    feather.replace();

    const form = document.getElementById('formNotas');
    const textarea = document.getElementById('nota');
    const ul = document.getElementById('listaNotas');
    const editIndexInput = document.getElementById('editIndex');

    // Adicionar ou atualizar nota
    form.addEventListener('submit', e => {
        e.preventDefault();
        const texto = textarea.value.trim();
        if (!texto) return;

        const editIndex = editIndexInput.value;
        if (editIndex !== "") {
            // Atualizar nota existente
            const li = ul.children[editIndex];
            li.innerHTML = texto + ' <i data-feather="edit" class="edit-btn"></i>';
            feather.replace();
            editIndexInput.value = "";
        } else {
            // Adicionar nova nota
            const li = document.createElement('li');
            li.classList.add('list-group-item');
            li.innerHTML = texto + ' <i data-feather="edit" class="edit-btn"></i>';
            ul.appendChild(li);
            feather.replace();
        }

        textarea.value = '';
    });

    // Editar nota
    ul.addEventListener('click', e => {
        if (e.target.classList.contains('edit-btn')) {
            const li = e.target.closest('li');
            const index = Array.from(ul.children).indexOf(li);
            textarea.value = li.textContent.trim();
            editIndexInput.value = index;
            textarea.focus();
        }
    });
</script>
