<script>
    document.addEventListener("DOMContentLoaded", function () {
        feather.replace();
        initFormValidation();
        updateStepIndicator(1);
        updateProgressBar(1);
    });

    let currentStep = 1;
    const totalSteps = 3;

    // Inicializa validação em tempo real
    function initFormValidation() {
        const form = document.getElementById("wizard-form");
        form.classList.add("was-validated");
        
        // Validação para o campo de confirmação de senha
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirm_password");
        
        if (password && confirmPassword) {
            password.addEventListener("input", validatePasswordMatch);
            confirmPassword.addEventListener("input", validatePasswordMatch);
        }
    }

    function validatePasswordMatch() {
        const pass = document.getElementById("password").value;
        const confirm = document.getElementById("confirm_password").value;
        const confirmField = document.getElementById("confirm_password");
        
        if (pass !== confirm) {
            confirmField.setCustomValidity("As senhas não coincidem");
            confirmField.classList.add("is-invalid");
            return false;
        } else {
            confirmField.setCustomValidity("");
            confirmField.classList.remove("is-invalid");
            return true;
        }
    }

    function nextStep() {
        if (!validateStep(currentStep)) {
            return false;
        }
        
        if (currentStep < totalSteps) {
            currentStep++;
            showStep(currentStep);
        }
        return true;
    }

    function prevStep() {
        if (currentStep > 1) {
            currentStep--;
            showStep(currentStep);
        }
    }

    function showStep(step) {
        // Esconde todos os steps
        const steps = document.querySelectorAll(".wizard-step");
        steps.forEach(s => {
            s.classList.add("d-none");
            s.classList.remove("fade-in");
        });

        // Mostra o step atual
        const current = document.getElementById(`step-${step}`);
        if (current) {
            current.classList.remove("d-none");
            current.classList.add("fade-in");
        }

        // Atualiza indicadores
        updateStepIndicator(step);
        updateProgressBar(step);
        
        // Scroll suave para o topo do formulário
        const form = document.getElementById("wizard-form");
        form.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function updateStepIndicator(step) {
        const links = document.querySelectorAll("#wizard-steps .nav-link");
        links.forEach(link => {
            const linkStep = parseInt(link.dataset.step);
            link.classList.remove("active");
            
            if (linkStep === step) {
                link.classList.add("active");
                link.classList.remove("disabled");
            } else if (linkStep < step) {
                // Steps anteriores podem ser acessados
                link.classList.remove("disabled");
                link.classList.remove("active");
            } else {
                // Steps futuros ficam disabled
                link.classList.add("disabled");
            }
        });
    }

    function updateProgressBar(step) {
        const bar = document.getElementById("progress-bar");
        if (bar) {
            const width = ((step - 1) / (totalSteps - 1)) * 100;
            bar.style.width = Math.round(width) + "%";
            bar.setAttribute("aria-valuenow", Math.round(width));
            bar.setAttribute("aria-valuemin", "0");
            bar.setAttribute("aria-valuemax", "100");
        }
    }

    function validateStep(step) {
        const current = document.getElementById(`step-${step}`);
        if (!current) return false;
        
        const inputs = current.querySelectorAll("input, textarea, select");
        let valid = true;

        // Reseta mensagens de erro anteriores
        inputs.forEach(input => {
            input.classList.remove("is-invalid");
            
            // Valida campos obrigatórios
            if (input.hasAttribute("required")) {
                if (!input.value.trim()) {
                    input.classList.add("is-invalid");
                    valid = false;
                }
            }
            
            // Validação específica para email
            if (input.type === "email" && input.value.trim()) {
                if (!isValidEmail(input.value)) {
                    input.classList.add("is-invalid");
                    valid = false;
                }
            }
            
            // Validação específica para senha
            if (input.type === "password" && input.id === "password") {
                if (input.value.length < 8) {
                    input.classList.add("is-invalid");
                    valid = false;
                }
            }
        });

        // Validação especial para step 1 (confirmação de senha)
        if (step === 1) {
            const passMatch = validatePasswordMatch();
            if (!passMatch) {
                valid = false;
            }
        }

        // Validação para step 2 (biografia)
        if (step === 2) {
            const bio = document.querySelector("textarea[name='biography']");
            if (bio && bio.value.length > 300) {
                bio.classList.add("is-invalid");
                valid = false;
                showAlert("A biografia não pode exceder 300 caracteres!", "danger");
            }
        }

        // Validação para step 3 (IBAN)
        if (step === 3) {
            const iban = document.querySelector("input[name='iban']");
            if (iban && iban.value && !isValidIBAN(iban.value)) {
                iban.classList.add("is-invalid");
                valid = false;
                showAlert("Formato de IBAN inválido!", "danger");
            }
        }

        if (!valid) {
            showAlert("Por favor, preencha todos os campos obrigatórios corretamente.", "danger");
        }

        return valid;
    }

    function isValidEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    }

    function isValidIBAN(iban) {
        // Validação básica para IBAN (pode ser expandida)
        const re = /^[A-Z]{2}\d{2}[A-Z0-9]{4,}$/;
        return re.test(iban.replace(/\s/g, '').toUpperCase());
    }

    function togglePassword(id) {
        const input = document.getElementById(id);
        if (input) {
            const type = input.type === "password" ? "text" : "password";
            input.type = type;
            
            // Atualiza ícone do Feather
            const button = input.nextElementSibling;
            if (button) {
                feather.replace();
            }
        }
    }

    function showAlert(message, type = "success") {
        // Remove alertas existentes
        const existingAlerts = document.querySelectorAll(".custom-alert");
        existingAlerts.forEach(alert => alert.remove());
        
        // Cria container de alerta se não existir
        let placeholder = document.getElementById("alert-placeholder");
        if (!placeholder) {
            placeholder = document.createElement("div");
            placeholder.id = "alert-placeholder";
            placeholder.style.position = "fixed";
            placeholder.style.top = "20px";
            placeholder.style.right = "20px";
            placeholder.style.zIndex = "9999";
            document.body.appendChild(placeholder);
        }
        
        const div = document.createElement("div");
        div.className = `custom-alert alert alert-${type} alert-dismissible fade show`;
        div.setAttribute("role", "alert");
        div.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        `;
        
        placeholder.appendChild(div);
        
        // Auto-remove após 5 segundos
        setTimeout(() => {
            div.classList.remove("show");
            setTimeout(() => div.remove(), 300);
        }, 5000);
    }

    // ================== CONTADOR DE BIografia ==================
    document.addEventListener("DOMContentLoaded", function() {
        const bioTextarea = document.querySelector("textarea[name='biography']");
        const bioCounter = document.getElementById("bio-counter");
        
        if (bioTextarea && bioCounter) {
            bioTextarea.addEventListener("input", function() {
                const length = this.value.length;
                bioCounter.textContent = `${length}/300 caracteres`;
                
                if (length > 300) {
                    bioCounter.classList.add("text-danger");
                    bioCounter.classList.remove("text-muted");
                } else {
                    bioCounter.classList.remove("text-danger");
                    bioCounter.classList.add("text-muted");
                }
            });
        }
    });

    // ================== PREVIEW DE IMAGEM ==================
    document.addEventListener("DOMContentLoaded", function() {
        const logoUpload = document.getElementById("logoUpload");
        const logoPreview = document.getElementById("logoPreview");
        
        if (logoUpload && logoPreview) {
            logoUpload.addEventListener("change", function(e) {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 2 * 1024 * 1024) { // 2MB limit
                        showAlert("A imagem não pode exceder 2MB!", "danger");
                        this.value = "";
                        return;
                    }
                    
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        logoPreview.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });
        }
    });

    // ================== AJAX SUBMIT ==================
    document.addEventListener("DOMContentLoaded", function() {
        const form = document.getElementById("wizard-form");
        
        form.addEventListener("submit", function (e) {
            e.preventDefault();

            // Valida o step atual antes de submeter
            if (!validateStep(currentStep)) {
                return false;
            }

            // Valida o formulário completo
            if (!form.checkValidity()) {
                showAlert("Por favor, verifique todos os campos do formulário.", "danger");
                return false;
            }

            const formData = new FormData(this);
            const submitButton = this.querySelector('button[type="submit"]');
            const originalText = submitButton.innerHTML;
            
            // Desabilita botão durante envio
            submitButton.disabled = true;
            submitButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Enviando...';

            fetch("processar_cadastro.php", {
                method: "POST",
                body: formData
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Erro na requisição");
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    showAlert("Cadastro concluído com sucesso!", "success");
                    this.reset();
                    currentStep = 1;
                    showStep(currentStep);
                    
                    // Redireciona após 2 segundos
                    setTimeout(() => {
                        window.location.href = "admin.html#/login";
                    }, 2000);
                } else {
                    showAlert(data.message || "Erro ao processar cadastro!", "danger");
                }
            })
            .catch(err => {
                console.error("Erro:", err);
                showAlert("Erro ao enviar os dados. Tente novamente.", "danger");
            })
            .finally(() => {
                // Reabilita botão
                submitButton.disabled = false;
                submitButton.innerHTML = originalText;
            });
        });
    });

</script>

<script>
    // Preview da logo
    document.getElementById('logoUpload').addEventListener('change', function (event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => document.getElementById('logoPreview').src = e.target.result;
            reader.readAsDataURL(file);
        }
    });

    // Geração automática de senha segura
    function gerarSenha(tamanho = 15) {
        const caracteres = "0123456789";
        let senha = "CraveNow_HJ_" + "";
        for (let i = 0; i < tamanho; i++) {
            senha += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
        }
        return senha;
    }

    // Exibir senha ao carregar a página
    window.addEventListener("DOMContentLoaded", () => {
        const inputSenha = document.getElementById("password");
        inputSenha.value = gerarSenha();
    });

    // Regenerar senha ao clicar no botão
    document.getElementById("btnRegenerate").addEventListener("click", () => {
        document.getElementById("password").value = gerarSenha();
    });

    // Validação do formulário
    (() => {
        'use strict';
        const forms = document.querySelectorAll('.needs-validation');
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>
