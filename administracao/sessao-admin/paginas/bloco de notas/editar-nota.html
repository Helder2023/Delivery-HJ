<div class="row mb-2 mb-xl-3">
    <div class="content-top col-auto d-sm-block">
        <h2>Editando Nota</h2>
    </div>

    <div class="col-auto ms-auto text-end mt-n1">

        <button class="btn shadow-sm" onclick="window.history.back()">
            <i class="align-middle" data-feather="arrow-left">&nbsp;</i> Voltar
        </button>
    </div>
</div>

<div class="card flex-fill p-4">
    <form>
        <div class="col-md-12">
            <label for="arquivo" class="form-label">Atualiza o seu Arquivo</label>
           <input class="form-control" type="file" name="" id="" style="margin-bottom: 10px;">
        </div>

        <div class="col-md-12">
            <label for="nota" class="form-label">Atualize a sua nota</label>
            <textarea class="form-control" id="nota" rows="4" placeholder="Digite aqui a nota..." required></textarea>   
        </div>

        <button class="btn btn-confirm btn-sm" type="submit" style="margin-top: 20px;">Editando Nota</button>
    </form>
</div>
