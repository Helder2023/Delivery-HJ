<script>
    (() => {

        const ctx = document.getElementById('comissaoMensalChart').getContext('2d');
        const seletorAno = document.getElementById('filtroAnoComissao');

        const meses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];

        const dadosComissao = {
            2023: [120, 150, 180, 130, 170, 200, 220, 210, 190, 230, 250, 270],
            2024: [200, 240, 260, 280, 300, 320, 310, 330, 350, 370, 390, 420],
            2025: [300, 340, 360, 380, 400, 420, 450, 470, 490, 520, 540, 580]
        };

        function darkModeAtivo() {
            return document.body.classList.contains("dark");
        }

        function criarGradiente(ctx, dark) {
            const g = ctx.createLinearGradient(0, 0, 0, 320);
            if (dark) {
                g.addColorStop(0, "rgba(0,184,255,0.7)");
                g.addColorStop(1, "rgba(0,184,255,0.05)");
            } else {
                g.addColorStop(0, "rgba(0,123,255,0.6)");
                g.addColorStop(1, "rgba(0,123,255,0.03)");
            }
            return g;
        }

        let chart;

        function renderizar(ano) {

            const dark = darkModeAtivo();

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: meses,
                    datasets: [{
                        label: 'Comissão',
                        data: dadosComissao[ano],
                        fill: true,
                        backgroundColor: criarGradiente(ctx, dark),
                        borderColor: dark ? '#00b8ff' : '#0066ff',
                        borderWidth: 3,
                        tension: 0.45,
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        pointBackgroundColor: dark ? '#00b8ff' : '#0066ff',
                        pointBorderWidth: 0,
                        shadowOffsetX: 0,
                        shadowOffsetY: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 1200,
                        easing: 'easeOutQuart'
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: dark ? '#1e1e2f' : '#ffffff',
                            titleColor: dark ? '#ffffff' : '#222222',
                            bodyColor: dark ? '#ffffff' : '#222222',
                            borderColor: dark ? '#2e2e42' : '#e0e0e0',
                            borderWidth: 1,
                            callbacks: {
                                label: (ctx) => ' AKZ ' + ctx.parsed.y.toLocaleString()
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: function () {
                                    return document.body.classList.contains('dark-mode') ? 'white' : 'black';
                                }
                            },
                            grid: { display: false }
                        },
                        y: {
                            ticks: {
                                color: function () {
                                    return document.body.classList.contains('dark-mode') ? 'white' : 'black';
                                }
                            },
                            grid: {
                                color: dark ? '#2e2e42' : '#e6e6e6'
                            }
                        }
                    }
                }
            });
        }

        seletorAno.addEventListener("change", () => {
            renderizar(seletorAno.value);
        });

        // redesenha se mudar tema
        new MutationObserver(() => renderizar(seletorAno.value))
            .observe(document.body, { attributes: true, attributeFilter: ['class'] });

        // inicial
        renderizar(seletorAno.value);

    })();
</script>
