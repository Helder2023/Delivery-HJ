<script>
    // ====================================================
// 📊 GRÁFICO FINANCEIRO - VERSÃO FUNCIONAL SIMPLIFICADA
// ====================================================

(function() {
    'use strict';
    
    // Configurações
    const CONFIG = {
        debug: true, // Ative para ver logs
        maxYears: 5,
        defaultCurrency: 'kz'
    };
    
    // Sistema de logging
    const logger = {
        log: (msg, data) => CONFIG.debug && console.log(`[FinanceChart] ${msg}`, data || ''),
        warn: (msg, data) => console.warn(`[FinanceChart] ⚠️ ${msg}`, data || ''),
        error: (msg, data) => console.error(`[FinanceChart] 🔴 ${msg}`, data || '')
    };
    
    // VERIFICAÇÃO SIMPLES
    function checkRequirements() {
        // 1. Verifica se Chart.js está carregado
        if (typeof Chart === 'undefined') {
            logger.error('Chart.js não está carregado!');
            return false;
        }
        
        // 2. Verifica se o canvas existe
        const canvas = document.getElementById('financeiroChart');
        if (!canvas) {
            logger.error('Canvas #financeiroChart não encontrado!');
            return false;
        }
        
        // 3. Verifica se o seletor de ano existe
        const yearSelect = document.getElementById('anoFiltro');
        if (!yearSelect) {
            logger.warn('Seletor #anoFiltro não encontrado');
        }
        
        return true;
    }
    
    // DADOS DE EXEMPLO (SIMPLIFICADO)
    function getFinancialData(year) {
        const currentYear = new Date().getFullYear();
        
        // Dados básicos para demonstração
        const baseData = {
            2025: {
                receitas: [4000, 4300, 4500, 4700, 5000, 5200, 5500, 5800, 6000, 6500, 7000, 7500],
                despesas: [2000, 2100, 2200, 2500, 2400, 2600, 2700, 2900, 3000, 3100, 3200, 3300]
            },
            2024: {
                receitas: [3500, 3600, 3800, 3900, 4200, 4400, 4700, 4900, 5100, 5300, 5500, 5800],
                despesas: [1800, 1900, 2000, 2200, 2100, 2300, 2400, 2600, 2700, 2800, 2900, 3000]
            },
            2023: {
                receitas: [3000, 3200, 3400, 3600, 3800, 4000, 4200, 4400, 4600, 4800, 5000, 5200],
                despesas: [1500, 1600, 1700, 1800, 1900, 2000, 2100, 2200, 2300, 2400, 2500, 2600]
            }
        };
        
        // Retorna dados do ano ou do ano atual
        return baseData[year] || baseData[currentYear] || baseData[2025];
    }
    
    // CALCULA LUCRO
    function calcularLucro(receitas, despesas) {
        return receitas.map((receita, index) => receita - despesas[index]);
    }
    
    // FORMATA MOEDA
    function formatarMoeda(valor) {
        return new Intl.NumberFormat('pt-AO', {
            style: 'currency',
            currency: 'AOA',
            minimumFractionDigits: 0
        }).format(valor).replace('AOA', 'kz');
    }
    
    // INICIALIZAÇÃO SIMPLES E DIRETA
    function inicializarGrafico() {
        logger.log('Iniciando inicialização do gráfico...');
        
        // Verifica requisitos básicos
        if (!checkRequirements()) {
            mostrarErro('Requisitos não atendidos. Verifique o console.');
            return;
        }
        
        // Elementos
        const canvas = document.getElementById('financeiroChart');
        const ctx = canvas.getContext('2d');
        const anoSelect = document.getElementById('anoFiltro');
        
        if (!ctx) {
            logger.error('Não foi possível obter contexto 2D do canvas');
            return;
        }
        
        // 1. CONFIGURA SELEÇÃO DE ANO
        configurarSeletorAno(anoSelect);
        
        // 2. OBTÉM ANO ATUAL
        const anoAtual = anoSelect ? parseInt(anoSelect.value) : new Date().getFullYear();
        
        // 3. OBTÉM DADOS
        const dados = getFinancialData(anoAtual);
        logger.log('Dados carregados:', { ano: anoAtual, dados });
        
        // 4. CALCULA LUCRO
        const lucro = calcularLucro(dados.receitas, dados.despesas);
        
        // 5. CORES DINÂMICAS
        const isDarkMode = document.body.classList.contains('dark-mode');
        const cores = {
            receita: isDarkMode ? '#4dabf7' : '#0d6efd',
            despesa: isDarkMode ? '#ff6b6b' : '#dc3545',
            lucro: isDarkMode ? '#51cf66' : '#198754',
            texto: isDarkMode ? 'rgba(255, 255, 255, 0.9)' : 'rgba(0, 0, 0, 0.9)',
            grade: isDarkMode ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)'
        };
        
        // 6. CRIA GRÁFICO
        const grafico = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'],
                datasets: [
                    {
                        label: 'Receitas',
                        data: dados.receitas,
                        backgroundColor: cores.receita,
                        borderRadius: 6,
                        borderWidth: 1,
                        borderColor: cores.receita + '80',
                        order: 3
                    },
                    {
                        label: 'Despesas',
                        data: dados.despesas,
                        backgroundColor: cores.despesa,
                        borderRadius: 6,
                        borderWidth: 1,
                        borderColor: cores.despesa + '80',
                        order: 2
                    },
                    {
                        label: 'Lucro',
                        type: 'line',
                        data: lucro,
                        borderColor: cores.lucro,
                        borderWidth: 3,
                        tension: 0.4,
                        pointRadius: 5,
                        pointBackgroundColor: isDarkMode ? '#2d2d2d' : '#ffffff',
                        pointBorderColor: cores.lucro,
                        pointBorderWidth: 2,
                        order: 1,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: {
                            color: cores.texto,
                            font: {
                                size: 12,
                                weight: '600'
                            }
                        }
                    },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        callbacks: {
                            label: function(context) {
                                const valor = context.raw;
                                const label = context.dataset.label;
                                return `${label}: ${formatarMoeda(valor)}`;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: {
                            display: false
                        },
                        ticks: {
                            color: cores.texto,
                            font: {
                                size: 11
                            }
                        }
                    },
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: cores.grade
                        },
                        ticks: {
                            color: cores.texto,
                            font: {
                                size: 11
                            },
                            callback: function(value) {
                                return formatarMoeda(value);
                            }
                        }
                    }
                }
            }
        });
        
        logger.log('Gráfico criado com sucesso!');
        
        // 7. ATUALIZA TOTAIS
        atualizarTotais(dados);
        
        // 8. CONFIGURA EVENTO DE MUDANÇA DE ANO
        if (anoSelect) {
            anoSelect.addEventListener('change', function() {
                const novoAno = parseInt(this.value);
                const novosDados = getFinancialData(novoAno);
                const novoLucro = calcularLucro(novosDados.receitas, novosDados.despesas);
                
                // Atualiza dados do gráfico
                grafico.data.datasets[0].data = novosDados.receitas;
                grafico.data.datasets[1].data = novosDados.despesas;
                grafico.data.datasets[2].data = novoLucro;
                
                grafico.update();
                
                // Atualiza totais
                atualizarTotais(novosDados);
                
                logger.log(`Gráfico atualizado para ${novoAno}`);
            });
        }
        
        // 9. CONFIGURA OBSERVADOR DE TEMA
        configurarObservadorTema(grafico, cores);
        
        // Armazena referência global
        window.graficoFinanceiro = grafico;
    }
    
    // FUNÇÕES AUXILIARES
    function configurarSeletorAno(selectElement) {
        if (!selectElement) return;
        
        const anoAtual = new Date().getFullYear();
        
        // Limpa opções existentes
        selectElement.innerHTML = '';
        
        // Adiciona últimos 5 anos
        for (let i = 0; i < CONFIG.maxYears; i++) {
            const ano = anoAtual - i;
            const option = document.createElement('option');
            option.value = ano;
            option.textContent = ano;
            if (i === 0) option.selected = true;
            selectElement.appendChild(option);
        }
    }
    
    function atualizarTotais(dados) {
        const totalReceitas = dados.receitas.reduce((a, b) => a + b, 0);
        const totalDespesas = dados.despesas.reduce((a, b) => a + b, 0);
        const totalLucro = totalReceitas - totalDespesas;
        
        // Atualiza elementos se existirem
        const atualizarElemento = (id, valor) => {
            const elemento = document.getElementById(id);
            if (elemento) {
                elemento.textContent = formatarMoeda(valor);
            }
        };
        
        atualizarElemento('total-receitas', totalReceitas);
        atualizarElemento('total-despesas', totalDespesas);
        atualizarElemento('total-lucro', totalLucro);
    }
    
    function configurarObservadorTema(grafico, coresBase) {
        const observer = new MutationObserver(function() {
            const isDarkMode = document.body.classList.contains('dark-mode');
            const novasCores = {
                receita: isDarkMode ? '#4dabf7' : '#0d6efd',
                despesa: isDarkMode ? '#ff6b6b' : '#dc3545',
                lucro: isDarkMode ? '#51cf66' : '#198754',
                texto: isDarkMode ? 'rgba(255, 255, 255, 0.9)' : 'rgba(0, 0, 0, 0.9)',
                grade: isDarkMode ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)'
            };
            
            // Atualiza cores do gráfico
            if (grafico && grafico.data && grafico.data.datasets) {
                grafico.data.datasets[0].backgroundColor = novasCores.receita;
                grafico.data.datasets[0].borderColor = novasCores.receita + '80';
                grafico.data.datasets[1].backgroundColor = novasCores.despesa;
                grafico.data.datasets[1].borderColor = novasCores.despesa + '80';
                grafico.data.datasets[2].borderColor = novasCores.lucro;
                grafico.data.datasets[2].pointBorderColor = novasCores.lucro;
                grafico.data.datasets[2].pointBackgroundColor = isDarkMode ? '#2d2d2d' : '#ffffff';
                
                // Atualiza opções
                grafico.options.plugins.legend.labels.color = novasCores.texto;
                grafico.options.scales.x.ticks.color = novasCores.texto;
                grafico.options.scales.y.ticks.color = novasCores.texto;
                grafico.options.scales.y.grid.color = novasCores.grade;
                
                grafico.update();
            }
        });
        
        observer.observe(document.body, {
            attributes: true,
            attributeFilter: ['class']
        });
    }
    
    function mostrarErro(mensagem) {
        const container = document.getElementById('financeiroChart')?.parentElement;
        if (container) {
            container.innerHTML = `
                <div class="alert alert-danger">
                    <h6>Erro ao carregar gráfico</h6>
                    <p class="mb-0">${mensagem}</p>
                    <button onclick="location.reload()" class="btn btn-sm btn-outline-danger mt-2">
                        Recarregar página
                    </button>
                </div>
            `;
        }
        logger.error(mensagem);
    }
    
    // INICIALIZAÇÃO AUTOMÁTICA
    function iniciar() {
        logger.log('Iniciando script do gráfico financeiro...');
        
        // Espera o DOM carregar
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                setTimeout(inicializarGrafico, 100);
            });
        } else {
            setTimeout(inicializarGrafico, 100);
        }
    }
    
    // Inicia o script
    iniciar();
    
})();

// ESTILOS INLINE (opcional - pode mover para CSS)
(function() {
    const styles = `
        .grafico-container {
            position: relative;
            height: 400px;
        }
        
        #financeiroChart {
            width: 100% !important;
            height: 100% !important;
        }
        
        @media (max-width: 768px) {
            .grafico-container {
                height: 300px;
            }
        }
    `;
    
    const styleSheet = document.createElement('style');
    styleSheet.textContent = styles;
    document.head.appendChild(styleSheet);
})();
</script>
