   <script>
    // ====================================================
// 🛡️ SISTEMA DE GRÁFICOS COM PROTEÇÃO CONTRA ERROS
// ====================================================

(function() {
    'use strict';
    
    // Configuração de segurança
    const CONFIG = {
        debug: false,
        chartVersion: '4.4.1'
    };
    
    // Sistema de logging
    const log = {
        info: (msg, data) => CONFIG.debug && console.info(`[Charts] ${msg}`, data || ''),
        warn: (msg, data) => console.warn(`[Charts] ⚠️ ${msg}`, data || ''),
        error: (msg, data) => console.error(`[Charts] 🔴 ${msg}`, data || '')
    };
    
    // Verificar se Chart.js está carregado
    function isChartLoaded() {
        if (typeof Chart === 'undefined') {
            log.error('Chart.js não foi carregado');
            return false;
        }
        return true;
    }
    
    // Função segura para obter elemento do DOM
    function getElementSafe(id) {
        const element = document.getElementById(id);
        if (!element) {
            log.warn(`Elemento não encontrado: #${id}`);
        }
        return element;
    }
    
    // Função segura para criar contexto de canvas
    function getCanvasContextSafe(canvasId) {
        const canvas = getElementSafe(canvasId);
        if (!canvas) return null;
        
        if (!(canvas instanceof HTMLCanvasElement)) {
            log.error(`Elemento #${canvasId} não é um canvas`);
            return null;
        }
        
        try {
            return canvas.getContext('2d');
        } catch (error) {
            log.error(`Erro ao obter contexto do canvas #${canvasId}:`, error);
            return null;
        }
    }
    
    // ====================================================
    // GRÁFICO: USUÁRIOS VS RESTAURANTES
    // ====================================================
    function initUsuariosRestaurantesChart() {
        log.info('Inicializando gráfico Usuários vs Restaurantes');
        
        const ctx = getCanvasContextSafe('usuariosRestaurantesChart');
        if (!ctx) {
            log.warn('Canvas não encontrado para gráfico Usuários vs Restaurantes');
            return null;
        }
        
        // Dados com fallback seguro
        const dadosPorAno = {
            2023: {
                restaurantes: [10, 12, 15, 18, 20, 22, 25, 27, 30, 33, 35, 40],
                usuarios: [100, 120, 150, 180, 200, 220, 250, 270, 300, 330, 350, 400]
            },
            2024: {
                restaurantes: [15, 18, 20, 22, 26, 30, 32, 36, 40, 42, 45, 48],
                usuarios: [150, 180, 200, 230, 260, 300, 320, 350, 380, 400, 420, 450]
            },
            2025: {
                restaurantes: [20, 25, 28, 30, 34, 38, 40, 43, 47, 50, 54, 60],
                usuarios: [200, 220, 250, 280, 310, 340, 370, 400, 430, 460, 490, 520]
            }
        };
        
        // Função segura para obter dados
        function getDadosAno(ano) {
            const anoNum = parseInt(ano);
            return dadosPorAno[anoNum] || dadosPorAno[2025]; // Fallback para 2025
        }
        
        const meses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
        
        // Função que cria o gráfico
        function criarGrafico(ano) {
            const dados = getDadosAno(ano);
            
            const dataUR = {
                labels: meses,
                datasets: [
                    {
                        label: 'Restaurantes',
                        data: dados.restaurantes,
                        backgroundColor: '#0d6efd',
                        borderRadius: 5,
                        borderWidth: 1,
                        borderColor: '#0a58ca'
                    },
                    {
                        label: 'Utilizadores',
                        data: dados.usuarios,
                        backgroundColor: '#198754',
                        borderRadius: 5,
                        borderWidth: 1,
                        borderColor: '#146c43'
                    }
                ]
            };
            
            try {
                return new Chart(ctx, {
                    type: 'bar',
                    data: dataUR,
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: { 
                                labels: { 
                                    color: function(context) {
                                        // Verifica se está no modo escuro
                                        return document.body.classList.contains('dark-mode') ? 'white' : 'black';
                                    }
                                } 
                            },
                            tooltip: {
                                backgroundColor: function(context) {
                                    return document.body.classList.contains('dark-mode') 
                                        ? 'rgba(0, 0, 0, 0.8)' 
                                        : 'rgba(255, 255, 255, 0.9)';
                                },
                                titleColor: function(context) {
                                    return document.body.classList.contains('dark-mode') ? 'white' : 'black';
                                },
                                bodyColor: function(context) {
                                    return document.body.classList.contains('dark-mode') ? 'white' : 'black';
                                },
                                callbacks: {
                                    label: function(context) {
                                        return `${context.dataset.label}: ${context.formattedValue}`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                ticks: { 
                                    color: function() {
                                        return document.body.classList.contains('dark-mode') ? 'white' : 'black';
                                    },
                                    font: { weight: 'bold' } 
                                },
                                grid: { 
                                    display: false 
                                }
                            },
                            y: {
                                beginAtZero: true,
                                ticks: { 
                                    color: function() {
                                        return document.body.classList.contains('dark-mode') ? 'white' : 'black';
                                    }
                                },
                                grid: { 
                                    color: function(context) {
                                        return document.body.classList.contains('dark-mode') 
                                            ? 'rgba(255, 255, 255, 0.1)' 
                                            : 'rgba(0, 0, 0, 0.1)';
                                    }
                                }
                            }
                        }
                    }
                });
            } catch (error) {
                log.error('Erro ao criar gráfico Usuários vs Restaurantes:', error);
                return null;
            }
        }
        
        // Cria gráfico inicial
        const selectAno = getElementSafe('filtroAno');
        const anoInicial = selectAno ? selectAno.value : '2025';
        let graficoUR = criarGrafico(anoInicial);
        
        // Adiciona evento de mudança com segurança
        if (selectAno) {
            selectAno.addEventListener('change', function(e) {
                if (graficoUR) {
                    try {
                        graficoUR.destroy();
                    } catch (destroyError) {
                        log.warn('Erro ao destruir gráfico anterior:', destroyError);
                    }
                }
                graficoUR = criarGrafico(e.target.value);
            });
        }
        
        return graficoUR;
    }
    
    // ====================================================
    // GRÁFICO: PEDIDOS POR HORA
    // ====================================================
    function initPedidosHoraChart() {
        log.info('Inicializando gráfico Pedidos por Hora');
        
        const ctx = getCanvasContextSafe('pedidosHoraChart');
        if (!ctx) {
            log.warn('Canvas não encontrado para gráfico Pedidos por Hora');
            return null;
        }
        
        try {
            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['0h', '2h', '4h', '6h', '8h', '10h', '12h', '14h', '16h', '18h', '20h', '22h'],
                    datasets: [{
                        label: 'Pedidos',
                        data: [5, 8, 12, 20, 35, 50, 40, 38, 25, 15, 10, 6],
                        borderColor: '#0d6efd',
                        backgroundColor: function(context) {
                            const chart = context.chart;
                            const {ctx, chartArea} = chart;
                            if (!chartArea) return null;
                            
                            const gradient = ctx.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);
                            gradient.addColorStop(0, 'rgba(13, 110, 253, 0.1)');
                            gradient.addColorStop(1, 'rgba(13, 110, 253, 0.4)');
                            return gradient;
                        },
                        tension: 0.3,
                        fill: true,
                        pointRadius: 5,
                        pointBackgroundColor: '#0d6efd',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { 
                            labels: { 
                                color: function() {
                                    return document.body.classList.contains('dark-mode') ? 'white' : 'black';
                                }
                            } 
                        }
                    },
                    scales: {
                        x: { 
                            ticks: { 
                                color: function() {
                                    return document.body.classList.contains('dark-mode') ? 'white' : 'black';
                                }
                            }, 
                            grid: { 
                                color: function() {
                                    return document.body.classList.contains('dark-mode') 
                                        ? 'rgba(255, 255, 255, 0.1)' 
                                        : 'rgba(0, 0, 0, 0.1)';
                                }
                            } 
                        },
                        y: { 
                            ticks: { 
                                color: function() {
                                    return document.body.classList.contains('dark-mode') ? 'white' : 'black';
                                }
                            }, 
                            grid: { 
                                color: function() {
                                    return document.body.classList.contains('dark-mode') 
                                        ? 'rgba(255, 255, 255, 0.1)' 
                                        : 'rgba(0, 0, 0, 0.1)';
                                }
                            }, 
                            beginAtZero: true 
                        }
                    }
                }
            });
        } catch (error) {
            log.error('Erro ao criar gráfico Pedidos por Hora:', error);
            return null;
        }
    }
    
    // ====================================================
    // GRÁFICO: TOP 5 RESTAURANTES
    // ====================================================
    function initTop5RestaurantesChart() {
        log.info('Inicializando gráfico Top 5 Restaurantes');
        
        const ctx = getCanvasContextSafe('top5RestaurantesChart');
        if (!ctx) {
            log.warn('Canvas não encontrado para gráfico Top 5 Restaurantes');
            return null;
        }
        
        try {
            return new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Churrasqueira Central', 'Bom Gosto', 'Express Pizza', 'Restaurante XYZ', 'Peixaria Moderna'],
                    datasets: [{
                        label: 'Vendas',
                        data: [120, 100, 95, 80, 70],
                        backgroundColor: [
                            '#198754',
                            '#0d6efd',
                            '#6c757d',
                            '#ffc107',
                            '#dc3545'
                        ],
                        borderRadius: 5,
                        borderWidth: 1,
                        borderColor: function(context) {
                            const colors = [
                                '#146c43',
                                '#0a58ca',
                                '#5c636a',
                                '#ffca2c',
                                '#b02a37'
                            ];
                            return colors[context.dataIndex] || '#000000';
                        }
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { 
                        legend: { 
                            display: false 
                        } 
                    },
                    scales: {
                        x: { 
                            ticks: { 
                                color: function() {
                                    return document.body.classList.contains('dark-mode') ? 'white' : 'black';
                                }
                            }, 
                            grid: { 
                                display: false 
                            } 
                        },
                        y: { 
                            ticks: { 
                                color: function() {
                                    return document.body.classList.contains('dark-mode') ? 'white' : 'black';
                                }
                            }, 
                            grid: { 
                                color: function() {
                                    return document.body.classList.contains('dark-mode') 
                                        ? 'rgba(255, 255, 255, 0.1)' 
                                        : 'rgba(0, 0, 0, 0.1)';
                                }
                            }, 
                            beginAtZero: true 
                        }
                    }
                }
            });
        } catch (error) {
            log.error('Erro ao criar gráfico Top 5 Restaurantes:', error);
            return null;
        }
    }
    
    // ====================================================
    // RELÓGIO EM TEMPO REAL
    // ====================================================
    function initTimeCard() {
        log.info('Inicializando relógio em tempo real');
        
        const realTimeElement = getElementSafe('real-time');
        const currentDateElement = getElementSafe('current-date');
        const fullDateElement = getElementSafe('full-date');
        
        if (!realTimeElement) {
            log.warn('Elemento do relógio não encontrado');
            return;
        }
        
        // Nomes em português
        const monthNames = [
            "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
            "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
        ];
        
        const dayNames = [
            "Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira",
            "Quinta-feira", "Sexta-feira", "Sábado"
        ];
        
        // Formatar número com 2 dígitos
        function formatTwoDigits(num) {
            return num < 10 ? '0' + num : num.toString();
        }
        
        // Atualizar hora e data
        function updateTime() {
            try {
                const now = new Date();
                
                // Formatar hora
                const hours = formatTwoDigits(now.getHours());
                const minutes = formatTwoDigits(now.getMinutes());
                const seconds = formatTwoDigits(now.getSeconds());
                
                // Atualizar elemento de hora
                realTimeElement.textContent = `${hours}:${minutes}:${seconds}`;
                
                // Efeito de pulso nos segundos pares
                if (now.getSeconds() % 2 === 0) {
                    realTimeElement.classList.add('pulse');
                } else {
                    realTimeElement.classList.remove('pulse');
                }
                
                // Formatar data
                if (currentDateElement || fullDateElement) {
                    const dayName = dayNames[now.getDay()];
                    const day = now.getDate();
                    const month = monthNames[now.getMonth()];
                    const year = now.getFullYear();
                    
                    if (currentDateElement) {
                        currentDateElement.textContent = `${dayName}, ${day} de ${month}`;
                    }
                    
                    if (fullDateElement) {
                        fullDateElement.textContent = `${day} de ${month} de ${year}`;
                    }
                }
                
            } catch (error) {
                log.error('Erro ao atualizar hora:', error);
            }
        }
        
        // Inicializar
        updateTime();
        const intervalId = setInterval(updateTime, 1000);
        
        // Limpar intervalo quando a página for descarregada
        window.addEventListener('beforeunload', () => {
            clearInterval(intervalId);
        });
        
        return intervalId;
    }
    
    // ====================================================
    // INICIALIZAÇÃO DE TODOS OS COMPONENTES
    // ====================================================
    function initAllCharts() {
        log.info('Inicializando todos os gráficos');
        
        // Verificar se Chart.js está disponível
        if (!isChartLoaded()) {
            log.warn('Chart.js não disponível. Tentando carregar...');
            
            // Carregar Chart.js dinamicamente
            const script = document.createElement('script');
            script.src = `https://cdn.jsdelivr.net/npm/chart.js@${CONFIG.chartVersion}/dist/chart.umd.min.js`;
            script.onload = function() {
                log.info('Chart.js carregado dinamicamente');
                setTimeout(initAllCharts, 100);
            };
            script.onerror = function() {
                log.error('Falha ao carregar Chart.js');
                showChartError();
            };
            document.head.appendChild(script);
            return;
        }
        
        // Inicializar gráficos
        const charts = {
            usuariosRestaurantes: initUsuariosRestaurantesChart(),
            pedidosHora: initPedidosHoraChart(),
            top5Restaurantes: initTop5RestaurantesChart()
        };
        
        // Inicializar relógio
        const clockInterval = initTimeCard();
        
        // Armazenar referências para limpeza
        window.CraveNowCharts = {
            charts: charts,
            clockInterval: clockInterval,
            destroyAll: function() {
                // Destruir todos os gráficos
                Object.values(charts).forEach(chart => {
                    if (chart && typeof chart.destroy === 'function') {
                        try {
                            chart.destroy();
                        } catch (error) {
                            log.warn('Erro ao destruir gráfico:', error);
                        }
                    }
                });
                
                // Parar relógio
                if (clockInterval) {
                    clearInterval(clockInterval);
                }
            }
        };
        
        log.info('Todos os gráficos inicializados com sucesso');
    }
    
    // Função para mostrar erro nos gráficos
    function showChartError() {
        const canvasIds = [
            'usuariosRestaurantesChart',
            'pedidosHoraChart',
            'top5RestaurantesChart'
        ];
        
        canvasIds.forEach(id => {
            const canvas = getElementSafe(id);
            if (canvas && canvas.parentNode) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'chart-error';
                errorDiv.innerHTML = `
                    <div style="text-align: center; padding: 20px; color: #666;">
                        <i class="fas fa-chart-line" style="font-size: 2rem; margin-bottom: 10px;"></i>
                        <p>Gráfico indisponível</p>
                        <button onclick="location.reload()" class="btn btn-sm btn-outline-primary">
                            Tentar novamente
                        </button>
                    </div>
                `;
                canvas.parentNode.replaceChild(errorDiv, canvas);
            }
        });
    }
    
    // ====================================================
    // INICIALIZAÇÃO QUANDO O DOM ESTIVER PRONTO
    // ====================================================
    function initialize() {
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initAllCharts);
        } else {
            // DOM já carregado
            setTimeout(initAllCharts, 100);
        }
    }
    
    // Inicializar
    initialize();
    
})();

// ====================================================
// ESTILOS ADICIONAIS
// ====================================================
(function() {
    const styles = document.createElement('style');
    styles.textContent = `
        .chart-error {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .pulse {
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        /* Estilos para modo escuro */
        .dark-mode .chart-error {
            background: #2d2d2d;
            border-color: #444;
            color: #ddd;
        }
        
        /* Responsividade dos canvas */
        canvas {
            max-width: 100%;
            height: auto !important;
        }
        
        .card-dashboard canvas {
            min-height: 250px;
        }
        
        @media (max-width: 768px) {
            .card-dashboard canvas {
                min-height: 200px;
            }
        }
    `;
    document.head.appendChild(styles);
})();
   </script>
